name: CI

# The quality gates (`cargo xtask ci`) on every pull request and on main. Linux only for now:
# windows-arm64.yml, freebsd.yml and release.yml still build the other platforms.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debug info for every test binary fills the hosted runner's disk; line tables keep
  # backtraces readable at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

# A newer push to a PR branch cancels its older run. Runs on main are never cancelled, so they
# finish and save the dependency cache that PR runs restore.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      # Main deletes the saved build its own save replaces.
      actions: write
    steps:
      - uses: actions/checkout@v4

      # Unused toolchains in the image are deleted in the background: it took 2 minutes in the
      # foreground, and the space is free long before the test build needs it.
      - name: Free disk space
        run: |
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            </dev/null >/dev/null 2>&1 &

      - name: Install system dependencies (egui/winit/rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      # Registry downloads only: the build itself is cached whole below. Only main saves caches;
      # PRs restore main's. A save per PR branch (usable by that branch only) fills the repo's
      # 10 GB cache budget and evicts main's.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The whole target directory from main's latest run, workspace crates and test binaries
      # included, so a PR rebuilds only what its changes reach. Cargo decides freshness of
      # workspace files by mtime, and a fresh checkout makes every file new: the next step dates
      # the checkout back, then re-touches every file that differs from the commit the cached
      # build was made from (recorded in target/.ci-build-sha), so exactly those rebuild.
      - name: Restore the build from main
        uses: actions/cache/restore@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ github.sha }}
          restore-keys: target-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - name: Mark files changed since the cached build
        run: |
          base=$(cat target/.ci-build-sha 2>/dev/null) || exit 0
          # Without the base commit the checkout keeps its new mtimes and everything rebuilds.
          git fetch -q --depth=1 origin "$base" || exit 0
          changed=$(git diff --name-only "$base" HEAD) || exit 0
          git ls-files -z | xargs -0 touch -d '2000-01-01 00:00:00'
          printf '%s\n' "$changed" | while IFS= read -r f; do
            if [ -e "$f" ]; then touch "$f"; fi
          done
          echo "Cached build from $base; $(printf '%s\n' "$changed" | grep -c .) files changed since"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Assets, brands, layers
        run: |
          cargo xtask assets
          cargo xtask brands
          cargo xtask layers

      # Reuses the CLI the Test step built; `cargo run -p vectorcraft-cli` would rebuild most of
      # the graph with a different feature set.
      - name: Parity checklist
        env:
          VECTORCRAFT_CLI: target/debug/vectorcraft-cli
        run: cargo xtask parity

      - name: wasm
        run: cargo xtask wasm

      # Main saves its build for the next runs and deletes the one it replaced, so a single copy
      # (several GB) counts against the cache budget.
      - name: Record the build's commit
        if: github.ref == 'refs/heads/main' && !cancelled()
        run: |
          echo "$GITHUB_SHA" > target/.ci-build-sha
          du -sh target

      - name: Save the build
        if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ github.sha }}

      - name: Delete older saved builds
        if: github.ref == 'refs/heads/main' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key target- --sort created_at --order desc \
            --limit 100 --json id,key --jq '.[1:][].id' |
            while read -r id; do gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; done
