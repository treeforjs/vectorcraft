name: CI

# The quality gates (`cargo xtask ci`) on every pull request and on main. Linux only for now:
# windows-arm64.yml, freebsd.yml and release.yml still build the other platforms.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debug info for every test binary fills the hosted runner's disk; line tables keep
  # backtraces readable at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

# A newer push to a PR branch cancels its older run. Runs on main are never cancelled, so they
# finish and save the dependency cache that PR runs restore.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Unused toolchains in the image are deleted in the background: it took 2 minutes in the
      # foreground, and the space is free long before the test build needs it.
      - name: Free disk space
        run: |
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            </dev/null >/dev/null 2>&1 &

      - name: Install system dependencies (egui/winit/rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      # Only main saves caches; PRs restore main's. A save per PR branch (usable by that branch
      # only) fills the repo's 10 GB cache budget and evicts main's.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # sccache caches compiled workspace and vendored crates by content hash. rust-cache above
      # keeps only registry dependencies, so those crates were rebuilt on every run and were most
      # of the build. Only main writes; PRs read main's entries, so every crate a PR leaves
      # unchanged comes from the cache. Set through GITHUB_ENV after rust-cache so its key stays put.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Use sccache
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_GHA_RW_MODE=READ_WRITE"
          } >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Assets, brands, layers
        run: |
          cargo xtask assets
          cargo xtask brands
          cargo xtask layers

      # Reuses the CLI the Test step built; `cargo run -p vectorcraft-cli` would rebuild most of
      # the graph with a different feature set.
      - name: Parity checklist
        env:
          VECTORCRAFT_CLI: target/debug/vectorcraft-cli
        run: cargo xtask parity

      - name: wasm
        run: cargo xtask wasm
