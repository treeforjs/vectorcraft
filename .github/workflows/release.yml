# Windows/Linux release pipeline. Signing is checked before any package build.
# Only the release branch can create or replace a draft; publishing is a maintainer action.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run mid-build or mid-upload; a newer push waits its turn.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  VECTORCRAFT_BUILD_SHA: ${{ github.sha }}
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    env:
      CRAFT_UPDATE_PUBLIC_KEY: ${{ vars.CRAFT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate the update public key
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import sys
          from pathlib import Path
          value = os.environ.get("CRAFT_UPDATE_PUBLIC_KEY", "")
          try:
              key = base64.b64decode(value, validate=True)
          except (ValueError, binascii.Error):
              sys.exit("::error::CRAFT_UPDATE_PUBLIC_KEY must be a single base64 Ed25519 public key")
          if base64.b64encode(key).decode() != value:
              sys.exit("::error::CRAFT_UPDATE_PUBLIC_KEY must use canonical base64 without whitespace")
          prefix = bytes.fromhex("302a300506032b6570032100")
          if len(key) == 32:
              key = prefix + key
          elif len(key) != 44 or not key.startswith(prefix):
              sys.exit("::error::CRAFT_UPDATE_PUBLIC_KEY must contain raw32 or DER44 Ed25519 bytes")
          Path(os.environ["RUNNER_TEMP"], "update-public.der").write_bytes(key)
          PY
      - name: Validate the release signing key
        if: github.ref == 'refs/heads/release'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Set UPDATE_SIGNING_KEY in the release environment before releasing"
            exit 1
          fi
          umask 077
          key_dir="$(mktemp -d "$RUNNER_TEMP/update-signing.XXXXXX")"
          trap 'rm -rf -- "$key_dir"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_dir/key.pem"
          openssl pkey -in "$key_dir/key.pem" -passin pass: -check -noout >/dev/null
          openssl pkey -in "$key_dir/key.pem" -passin pass: -pubout -outform DER \
            -out "$key_dir/derived-public.der"
          if ! cmp -s "$key_dir/derived-public.der" "$RUNNER_TEMP/update-public.der"; then
            echo "::error::UPDATE_SIGNING_KEY does not match CRAFT_UPDATE_PUBLIC_KEY"
            exit 1
          fi
      - id: v
        name: Resolve version
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### VectorCraft v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          # Windows on ARM: cross-compiled on the x64 runner, so signing and WiX run as above.
          # .github/workflows/windows-arm64.yml installs and runs it on ARM64 hardware.
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      VECTORCRAFT_VERSION: ${{ needs.version.outputs.version }}
      VECTORCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      # The update signing key's public half, embedded so in-app updates can verify downloads
      # (a repository variable, not a secret; see docs/releasing.md › In-app updates).
      CRAFT_UPDATE_PUBLIC_KEY: ${{ vars.CRAFT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      # Japanese UI/document fonts, embedded by crates/text/build.rs (CRAFT_FONTS_DIR on the build
      # step). Bump the commit deliberately; see craftrules standards/fonts.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$VECTORCRAFT_VERSION"
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build, sign, package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # The oldest GitHub-hosted image, so the binaries only need glibc >= 2.35 (Ubuntu 22.04+,
    # Debian 12+, Fedora 36+, RHEL 10). See docs/releasing.md.
    runs-on: ${{ matrix.runner }}
    # No `environment: release`: Linux packages are not signed (checksums in SHA256SUMS.txt).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      VECTORCRAFT_VERSION: ${{ needs.version.outputs.version }}
      VECTORCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      # The update signing key's public half, embedded so in-app updates can verify downloads
      # (a repository variable, not a secret; see docs/releasing.md › In-app updates).
      CRAFT_UPDATE_PUBLIC_KEY: ${{ vars.CRAFT_UPDATE_PUBLIC_KEY }}
      NFPM_VERSION: 2.47.0
    steps:
      - uses: actions/checkout@v7
      # Japanese UI/document fonts, embedded by crates/text/build.rs (CRAFT_FONTS_DIR on the build
      # step). Bump the commit deliberately; see craftrules standards/fonts.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            desktop-file-utils appstream python3-yaml zsync
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VECTORCRAFT_VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/vectorcraft$|metainfo|applications'
          ldd target/release/vectorcraft
          python3 -c "import yaml; m = yaml.safe_load(open('packaging/linux/flatpak/ai.storyteller.vectorcraft.yml')); assert m['id'] == 'ai.storyteller.vectorcraft'"
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
            # Update information is embedded, and the .zsync for delta updates sits beside it.
            # No APPIMAGE_EXTRACT_AND_RUN here: with it the runtime passes --appimage-* flags on
            # to the app instead of answering them itself.
            "$appimage" --appimage-updateinformation \
              | grep -F "gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY#*/}|latest|vectorcraft-*-linux-${{ matrix.arch }}.AppImage.zsync"
            test -s "$appimage.zsync"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: github.ref == 'refs/heads/release'
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CRAFT_UPDATE_PUBLIC_KEY: ${{ vars.CRAFT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          for arch in x64 x86 arm64; do
            test -s "vectorcraft-$VERSION-windows-$arch.msi"
            test -s "vectorcraft-$VERSION-windows-$arch-portable.zip"
          done
          for arch in x86_64 aarch64; do
            for format in AppImage AppImage.zsync deb rpm tar.gz; do
              test -s "vectorcraft-$VERSION-linux-$arch.$format"
            done
          done
          sha256sum -- * | tee SHA256SUMS.txt
      # In-app updates install only what this signature covers (craft-update; see
      # docs/releasing.md › In-app updates). Written after the list, so it isn't listed in it.
      - name: Sign the checksum list
        working-directory: artifacts
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ] || [ -z "$CRAFT_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY and CRAFT_UPDATE_PUBLIC_KEY are required"
            exit 1
          fi
          umask 077
          key_dir="$(mktemp -d "$RUNNER_TEMP/update-signing.XXXXXX")"
          trap 'rm -rf -- "$key_dir"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_dir/key.pem"
          PUBLIC_KEY_DER="$key_dir/expected-public.der" python3 - <<'PY'
          import base64
          import binascii
          import os
          import sys
          from pathlib import Path
          value = os.environ["CRAFT_UPDATE_PUBLIC_KEY"]
          try:
              key = base64.b64decode(value, validate=True)
          except (ValueError, binascii.Error):
              sys.exit("::error::CRAFT_UPDATE_PUBLIC_KEY must be a single base64 Ed25519 public key")
          if base64.b64encode(key).decode() != value:
              sys.exit("::error::CRAFT_UPDATE_PUBLIC_KEY must use canonical base64 without whitespace")
          prefix = bytes.fromhex("302a300506032b6570032100")
          if len(key) == 32:
              key = prefix + key
          elif len(key) != 44 or not key.startswith(prefix):
              sys.exit("::error::CRAFT_UPDATE_PUBLIC_KEY must contain raw32 or DER44 Ed25519 bytes")
          Path(os.environ["PUBLIC_KEY_DER"]).write_bytes(key)
          PY
          openssl pkey -in "$key_dir/key.pem" -passin pass: -pubout -outform DER \
            -out "$key_dir/derived-public.der"
          if ! cmp -s "$key_dir/derived-public.der" "$key_dir/expected-public.der"; then
            echo "::error::UPDATE_SIGNING_KEY does not match CRAFT_UPDATE_PUBLIC_KEY"
            exit 1
          fi
          openssl pkeyutl -sign -inkey "$key_dir/key.pem" -passin pass: -rawin \
            -in SHA256SUMS.txt -out "$key_dir/signature.bin"
          test "$(wc -c < "$key_dir/signature.bin")" -eq 64
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$key_dir/expected-public.der" -rawin \
            -in SHA256SUMS.txt -sigfile "$key_dir/signature.bin"
          base64 -w0 "$key_dir/signature.bin" > SHA256SUMS.txt.sig
      - name: Create or update the draft release
        working-directory: artifacts
        run: |
          set -euo pipefail
          tag="v$VERSION"
          title="VectorCraft v$VERSION"
          printf '%s\n' "Windows and Linux packages for VectorCraft v$VERSION." \
            "Downloads are verified with the signed SHA256SUMS.txt checksum list." \
            > "$RUNNER_TEMP/release-notes.md"
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag is already published. Bump the version (cargo xtask version set) before pushing to release."
              exit 1
            fi
            echo "Updating draft $tag: replacing its assets"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$tag" --clobber -- *
          else
            echo "Creating draft $tag"
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/release-notes.md" "${pre[@]}" -- *
          fi
          {
            echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
