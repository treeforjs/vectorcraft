# VectorCraft parity checklist against the reference vector illustration app (Illustrator 2026 feature set).
# Validated and reported by `cargo xtask parity`. One row per user-visible feature; update the row in the same PR
# that ships or improves the feature, plus a ROADMAP.md line.
# Status: `shipped` = usable today with at least one cited test; `partial` = part exists (notes say what is missing);
# `planned` = not started; `na` = cloud- or service-only (notes name the local alternative).
# `commands` are engine registry ids (`vectorcraft-cli commands`) or UI_COMMANDS ids (crates/ui-egui/src/menus.rs);
# `tools` are tool ids from crates/tools/src/catalog.rs. Tiers: P0 everyday, P1 common, P2 advanced, P3 niche.
[schema]
version = 1
statuses = ["planned", "partial", "shipped", "na"]
tiers = ["P0", "P1", "P2", "P3", "N/A"]
areas = { A = "files", B = "view", C = "select", D = "draw", E = "path", F = "transform", G = "paint", H = "effects", I = "type", J = "brushes", K = "layers", L = "images", M = "automation", N = "print", O = "interface", P = "cloud" }

