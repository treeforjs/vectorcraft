# Performance budgets for `cargo xtask perf` (docs/performance.md).
#
# Interactive scenarios of everyday vector editing on a dense document: 10,000 paths (stroked
# ellipses, translucent rectangles, stroked stars) and 200 point-type labels on a 1600×1200 pt
# page, the canvas a 1920×1080 viewport rendered on the CPU like the desktop canvas.
#
# Each [[scenario]] is measured by one row of one bench (`bench` + `row`, the row's exact name in
# the bench's `--json` report), judged on `metric` (p50 | p95 | max; default p95) against
# `budget_ms`. `enforce = false` marks a target the code doesn't meet yet: it is reported as
# "over budget" but only a regression fails the run; flip it to true in the PR that meets it.
# Scenarios the code can't support yet carry `not_measurable` (why) instead of a bench: never
# invent a number for them.
#
# Budget classes: a frame of a drag or a canvas refresh ≤ 16–25 ms (one display frame at 60 Hz,
# with headroom); a command and the refresh after it ≤ 50–100 ms (feels immediate); opening or
# saving a large file ≤ 1–3 s.
#
# Benches run in release with `--json <file>` appended. `quick_args` = also runs in
# `cargo xtask perf --quick` (a 1,000-path document; budgets don't apply there).

[settings]
# A scenario regresses when its p50 grows by more than this share of the baseline…
regression_pct = 15.0
# …and by more than this many milliseconds (timer noise on very fast rows).
regression_min_ms = 1.0

[[bench]]
name = "perf_scenarios"
package = "vectorcraft-engine"
quick_args = ["--quick"]
note = "10,000-path document: drags, commands, undo, live effects, area type, Pathfinder, open/save; CPU canvas 1920x1080"

# ---- drags: one pointer move of a tool drag plus the canvas refresh ---------------------------

[[scenario]]
id = "V01"
title = "Drag 1 selected object with the Selection tool (per move + canvas refresh)"
bench = "perf_scenarios"
row = "selection drag, 1 object (per move + canvas render)"
budget_ms = 25
# Misses today (2026-10-19, 4-core Xeon): p95 55 ms: the whole viewport re-renders every move (V04).
enforce = false

[[scenario]]
id = "V02"
title = "Drag 1,000 selected objects with the Selection tool (per move + canvas refresh)"
bench = "perf_scenarios"
row = "selection drag, 1,000 objects (per move + canvas render)"
budget_ms = 25
# Misses today (2026-10-19, 4-core Xeon): p95 79 ms: the full re-render (V04) plus ~10 ms of tool event.
enforce = false

[[scenario]]
id = "V03"
title = "Edit an anchor: Direct Selection handle drag on a 5,000-anchor path at 800 % (per move + refresh)"
bench = "perf_scenarios"
row = "direct selection handle drag, 5,000-anchor path (per move + canvas render)"
budget_ms = 16
# Misses today (2026-10-19, 4-core Xeon): p95 83 ms: the zoomed-in render of the long stroked path.
enforce = false

